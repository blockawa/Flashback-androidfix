name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build
        run: ./gradlew buildAllAndCollect --no-daemon --stacktrace --continue

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: flashback-androidfix
          path: build/libs/**/*.jar
          if-no-files-found: error
