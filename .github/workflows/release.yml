name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.0
        required: true
      title:
        description: Release title (defaults to the tag)
        required: false
        default: ""
      notes:
        description: Release notes (empty = auto-generated from commits)
        required: false
        default: ""
      draft:
        description: Create as draft
        type: boolean
        default: false
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build
        run: ./gradlew buildAllAndCollect --no-daemon --stacktrace

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          shopt -s globstar
          files=(build/libs/**/*.jar)
          flags=()
          if [ -n "$TITLE" ]; then flags+=(--title "$TITLE"); fi
          if [ -n "$NOTES" ]; then flags+=(--notes "$NOTES"); else flags+=(--generate-notes); fi
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" "${files[@]}"
